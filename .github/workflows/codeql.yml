# SAST (Static Application Security Testing) com CodeQL
name: CodeQL (SAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira, 03h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Análise CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publicar alertas na aba Security
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
