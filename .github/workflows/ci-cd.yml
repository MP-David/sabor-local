# Pipeline principal de CI/CD do Sabor Local
# Commit/PR → Dependências → Qualidade → Testes → Segurança → Build (artefato) → Deploy → Smoke test
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Princípio do menor privilégio: cada job pede só o que precisa
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # 1) Dependências + Qualidade + Testes
  quality:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para o SonarQube

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes + cobertura (falha abaixo do limite mínimo)
        run: npm run coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: SonarQube Scan + Quality Gate
        # PRs vindos de forks não recebem secrets; nesse caso a análise é pulada
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # espera o resultado do Quality Gate: se reprovar, o pipeline para aqui
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # 2) Segurança: dependências, vulnerabilidades e segredos
  security:
    name: Segurança (dependências e segredos)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comentário do dependency-review no PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o gitleaks varre todo o histórico

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (falha em vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high

      - name: Verificar assinaturas das dependências (supply chain)
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      - name: Dependency Review (novas dependências do PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3) Build: gera o artefato (pasta dist/)
  build:
    name: Build e artefato
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build de produção (Vite)
        run: npm run build

      - name: Registrar informações do build
        run: |
          cat > dist/build-info.json <<JSON
          {
            "version": "$(node -p "require('./package.json').version")",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run": "${GITHUB_RUN_NUMBER}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          ls -la dist dist/assets

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v7
        with:
          name: sabor-local-dist
          path: dist/
          retention-days: 30

      - name: Preparar artefato para o GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # 4) Deploy: publica o MESMO artefato no GitHub Pages (somente main)
  deploy:
    name: Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test da versão publicada
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL" | grep -q "Sabor Local"; then
              echo "✅ Aplicação publicada respondendo em $URL"
              curl -fsS "${URL}build-info.json"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando propagação..."; sleep 15
          done
          echo "❌ A aplicação não respondeu após o deploy"; exit 1

  # 5) Docker (bônus): imagem nginx, scan de vulnerabilidades e publicação no GHCR
  docker:
    name: Docker (build, scan e publicação)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Metadados da imagem (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build da imagem (local, para o scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sabor-local:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste do container (health check)
        run: |
          docker run -d --name app -p 8080:8080 sabor-local:scan
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/health.json && break
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -q "Sabor Local"
          docker rm -f app

      - name: Scan de vulnerabilidades da imagem (Grype)
        uses: anchore/scan-action@v7
        with:
          image: sabor-local:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
